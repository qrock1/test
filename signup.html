<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Регистрация — ArbiX</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="theme-dark">
  <main class="section">
    <div class="container split">
      <div>
        <a class="logo" href="index.html">ArbiX</a>
        <h1>Создать аккаунт</h1>
        <p class="muted">Зарегистрируйтесь и подключите биржи для арбитража.</p>
      </div>
      <div class="card">
        <form class="form">
          <label>
            <span>Имя пользователя</span>
            <input class="input" placeholder="arbix-trader" />
          </label>
          <label>
            <span>Email</span>
            <input class="input" type="email" placeholder="name@domain.com" />
          </label>
          <label>
            <span>Пароль</span>
            <input class="input" type="password" placeholder="Минимум 8 символов" />
          </label>
          <label>
            <span>Подтвердите пароль</span>
            <input class="input" type="password" placeholder="Повторите пароль" />
          </label>
          <label class="muted">
            <input type="checkbox" /> Я принимаю условия сервиса
          </label>
          <button class="btn btn--primary" type="button">Создать аккаунт</button>
          <a class="muted" href="login.html">Уже есть аккаунт? Войти</a>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
