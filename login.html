<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход — ArbiX</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="theme-dark">
  <main class="section">
    <div class="container split">
      <div>
        <a class="logo" href="index.html">ArbiX</a>
        <h1>Вход в платформу</h1>
        <p class="muted">Добро пожаловать обратно. Войдите для доступа к арбитражу.</p>
      </div>
      <div class="card">
        <form class="form">
          <label>
            <span>Email или Username</span>
            <input class="input" type="email" placeholder="name@domain.com" />
          </label>
          <label>
            <span>Пароль</span>
            <input class="input" type="password" placeholder="••••••••" />
          </label>
          <label class="muted">
            <input type="checkbox" /> Запомнить меня
          </label>
          <button class="btn btn--primary" type="button">Войти</button>
          <a class="muted" href="#">Забыли пароль?</a>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
