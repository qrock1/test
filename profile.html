<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Профиль — ArbiX</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="theme-dark">
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">ArbiX</a>
      <nav class="nav">
        <a href="dashboard.html">Дашборд</a>
        <a href="profile.html">Профиль</a>
        <a href="settings.html">Настройки</a>
      </nav>
      <div class="header__actions">
        <button class="chip">RU</button>
      </div>
      <button class="burger" aria-label="Открыть меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Профиль пользователя</h1>
        <p>Управляйте личными данными и безопасностью.</p>
      </div>
    </section>

    <section class="section">
      <div class="container split">
        <div class="card">
          <h3>Личные данные</h3>
          <form class="form">
            <input class="input" placeholder="Имя" value="Анна Петрова" />
            <input class="input" placeholder="Email" value="anna@arbix.io" />
            <input class="input" placeholder="Телефон" value="+7 999 000-00-00" />
            <button class="btn btn--primary" type="button">Сохранить</button>
          </form>
        </div>
        <div class="card">
          <h3>Безопасность</h3>
          <ul class="list">
            <li>2FA: включено</li>
            <li>Последний вход: Москва · 2 часа назад</li>
            <li>Статус KYC: проверен</li>
          </ul>
          <div class="hero__cta">
            <a class="btn btn--ghost" href="#">Сменить пароль</a>
            <a class="btn btn--primary" href="#">Управлять 2FA</a>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
